# Full test suite: Linux on the oldest and newest supported Python, plus Windows and macOS (the reference cards in
# tests/fixtures must come out identical on every platform). Runs on version tags and by hand (Actions tab -> tests ->
# Run workflow), not on every push.
name: tests

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python }} ${{ matrix.extras }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            extras: "test"            # core install, without OR-Tools
          - os: ubuntu-latest
            python: "3.14"
            extras: "test,verify"
          - os: windows-latest
            python: "3.14"
            extras: "test"
          - os: macos-latest           # arm64
            python: "3.14"
            extras: "test"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[${{ matrix.extras }}]"
      - run: python -m pytest tests -q
