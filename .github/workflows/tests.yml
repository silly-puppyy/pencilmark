# Full test suite on Linux, oldest and newest supported Python. Runs on version tags and by hand (Actions tab ->
# tests -> Run workflow), not on every push.
name: tests

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} ${{ matrix.extras }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            extras: "test"            # core install, without OR-Tools
          - python: "3.14"
            extras: "test,verify"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[${{ matrix.extras }}]"
      - run: python -m pytest tests -q
