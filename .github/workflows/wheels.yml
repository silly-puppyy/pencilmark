# Builds wheels and the sdist, smoke-tests every wheel (tests/smoke.py), and stores them as workflow artifacts.
# Publishing to PyPI is a separate, manual step (workflow_dispatch with publish=true, or a published GitHub release)
# that uses PyPI trusted publishing; nothing is uploaded on ordinary pushes.
name: wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built distributions to PyPI"
        type: boolean
        default: false

jobs:
  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel]   # macOS arm64 is cross-built on Intel (pyproject)
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v3.1.4    # 3.x builds CPython 3.14
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
