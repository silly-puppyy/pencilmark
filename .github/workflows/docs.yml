# Builds the documentation site (Docusaurus, website/; pages from docs/) and publishes it with the JSON Schemas on
# GitHub Pages: https://silly-puppyy.github.io/pencilmark/ and .../schema/sudoku-puzzle-1.json, sudoku-grade-1.json
# (the schemas' $id).
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "README.md", "src/pencilmark/api.py", "tools/gen_api_md.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: python3 tools/gen_api_md.py && cp README.md docs/index.md
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: |
          mkdir -p website/build/schema
          cp docs/sudoku-puzzle.schema.json website/build/schema/sudoku-puzzle-1.json
          cp docs/sudoku-grade.schema.json website/build/schema/sudoku-grade-1.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
