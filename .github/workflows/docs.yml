# Builds the documentation site (Docusaurus, website/; pages from docs/) and publishes it with the JSON Schemas on
# GitHub Pages: https://silly-puppyy.github.io/pencilmark/ and .../schema/pencilmark-puzzle-1.json, pencilmark-grade-1.json
# (the schemas' $id).
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "README.md", "src/pencilmark/**", "tools/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release tags: each page's "as of" version (tools/gen_page_versions.py)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: sudo apt-get install -y doxygen   # reads csrc/ for the C++ reference (tools/gen_cpp_reference.py)
      - run: python3 tools/tasks.py prepare   # generated pages, swatches, the root documents' copies (as the local build)
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: |
          mkdir -p website/build/schema
          cp docs/pencilmark-puzzle.schema.json website/build/schema/pencilmark-puzzle-1.json
          cp docs/pencilmark-grade.schema.json website/build/schema/pencilmark-grade-1.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
