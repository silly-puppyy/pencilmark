# Builds the documentation site (MkDocs) and publishes it with the JSON Schemas on GitHub Pages:
# https://silly-puppyy.github.io/pencilmark/ and .../schema/sudoku-puzzle-1.json, sudoku-grade-1.json (the schemas' $id).
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "CHANGELOG.md", "mkdocs.yml", "src/pencilmark/api.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<9.8" "mkdocstrings[python]"
      - run: cp README.md docs/index.md
      - run: mkdocs build --strict -d site
      - run: |
          mkdir -p site/schema
          cp docs/sudoku-puzzle.schema.json site/schema/sudoku-puzzle-1.json
          cp docs/sudoku-grade.schema.json site/schema/sudoku-grade-1.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
