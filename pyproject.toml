[build-system]
requires = ["setuptools>=69", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "pencilmark"
version = "1.0.0"
description = "Human-like difficulty grader, solver and generator for classic and variant sudoku"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pencilmark contributors" }]
keywords = ["sudoku", "puzzle", "difficulty", "grader", "solver", "generator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "lzstring>=1.0.4",
]

[project.urls]
Homepage = "https://github.com/silly-puppyy/pencilmark"
Documentation = "https://silly-puppyy.github.io/pencilmark/"
Source = "https://github.com/silly-puppyy/pencilmark"
Issues = "https://github.com/silly-puppyy/pencilmark/issues"
Changelog = "https://github.com/silly-puppyy/pencilmark/blob/main/CHANGELOG.md"

[project.optional-dependencies]
verify = ["ortools>=9.8"]
test = ["pytest>=7", "jsonschema>=4.18"]

[project.scripts]
pencilmark = "pencilmark.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pencilmark = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]      # pycodestyle, pyflakes, import order
ignore = [
  "E731",   # named lambdas are used deliberately for small local helpers
  "E741",   # single-letter names such as l follow the maths they implement
  "E501",   # the formatter sets code width; long comments and strings are left as written
]

[tool.ruff.lint.per-file-ignores]
"src/pencilmark/__init__.py" = ["F401"]   # re-exports the public API


[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *_i686 *-musllinux_*"
test-command = "python {project}/tests/smoke.py"   # quick check of every wheel; tests.yml runs the full suite
build-verbosity = 1

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]     # arm64 cross-built on the Intel runner (arm64 runners rarely got a machine); not smoke-tested
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
